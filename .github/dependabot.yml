# 每周检查依赖与 GitHub Actions 更新，自动开 PR（小版本 CI 绿灯即可合并）
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps(npm)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'deps(actions)'
